# =====================================================
# Docker Compose - Production Stack
# =====================================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=company_project
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d company_project"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  # Backend API
  be-backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: be-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DDL_AUTO=update
      - RENDER=true
      - DB_URL=jdbc:postgresql://postgres:5432/company_project
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres123}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  # Frontend Web
  fe-web:
    build:
      context: ./frontend-web-v2
      dockerfile: Dockerfile
    container_name: fe-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      be-backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
