name: CI/CD Pipeline

on:
  push:
    branches: [main, Dung, master]
  pull_request:
    branches: [main, Dung, master]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  # =====================================================
  # Job 1: Backend - Build & Upload Artifact
  # =====================================================
  backend-build:
    name: Backend Build (Java ${{ env.JAVA_VERSION }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backend
        run: cd BE && mvn package -DskipTests -B

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-war
          path: BE/target/BE-0.0.1-SNAPSHOT.war
          retention-days: 1

  # =====================================================
  # Job 2: Frontend - Build
  # =====================================================
  frontend-build:
    name: Frontend Build (Node ${{ env.NODE_VERSION }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frontend-web-v2
          sparse-checkout-cone-mode: false

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend-web-v2/package-lock.json

      - name: Install dependencies
        run: cd frontend-web-v2 && npm ci

      - name: Build Frontend
        run: cd frontend-web-v2 && npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-web-v2/dist
          retention-days: 1

  # =====================================================
  # Job 3: Deploy Backend to Render (Auto-Deploy via render.yaml)
  # =====================================================
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: backend-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Dung' || github.ref == 'refs/heads/master')
    environment: production

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-war
          path: ./dist

      - name: Deploy to Render via Blueprint
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "Deploying via render.yaml (Docker layers cached on Render)..."
          RESPONSE=$(curl -s -X POST "https://api.render.com/v1/blueprints" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "serviceName": "be-backend",
              "repo": "'$GITHUB_REPOSITORY'",
              "branch": "'$GITHUB_REF_NAME'",
              "dry": false
            }')
          echo "Deployment triggered: $RESPONSE"

  # =====================================================
  # Job 4: Deploy Frontend to Vercel
  # =====================================================
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: frontend-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Dung' || github.ref == 'refs/heads/master')
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          vercel --prod --token=$VERCEL_TOKEN --yes --dir=dist
