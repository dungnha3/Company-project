# Test profile configuration
# Uses H2 in-memory database instead of SQL Server

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer;NON_KEYWORDS=MONTH,YEAR,VALUE,KEY,DAY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
# Fix H2 compatibility
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=false
# Store enums as VARCHAR to avoid H2-incompatible enum() check constraints
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=12
spring.jpa.open-in-view=true

# Disable Redis for tests
spring.data.redis.enabled=false
spring.cache.type=simple

# JWT for tests
jwt.secret=testSecretKeyForTestingPurposesOnlyDoNotUseInProduction123456789
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# Disable Firebase for tests
firebase.enabled=false

# Disable mail for tests
spring.mail.host=localhost
spring.mail.port=25

# Disable MinIO for tests  
minio.enabled=false

# Logging
logging.level.root=WARN
logging.level.DoAn.BE=DEBUG

# Disable rate limiting for tests — avoids 429 when bulk testing
rate.limit.enabled=false
