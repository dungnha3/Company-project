# =====================================================
# APPLICATION CONFIGURATION
# Enterprise Management System - Backend
# =====================================================

# Application Info
spring.application.name=BE
server.port=8080

# Load .env file
spring.config.import=optional:dotenv:.env

# HTTP Character Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Graceful Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Docker Compose (disable auto-detection)
spring.docker.compose.enabled=false

# =====================================================
# DATABASE CONFIGURATION (SQL Server)
# =====================================================

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=DACN;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=false
spring.jpa.properties.hibernate.query.startup_check=false
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.open-in-view=false

# Hibernate Batching (Performance)
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Hibernate Query Caching (Performance)
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000

# =====================================================
# REDIS CONFIGURATION (Caching & Data)
# =====================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60000

# Cache Configuration
spring.cache.type=simple



# =====================================================
# MAIL CONFIGURATION (JavaMailSender)
# =====================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# App Mail Settings (enable/disable email sending)
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@dacn.com}
app.base-url=${APP_BASE_URL:http://localhost:5173}
app.client.url=${APP_CLIENT_URL:http://localhost:5173}

# =====================================================
# FIREBASE CONFIGURATION
# =====================================================
firebase.credentials.path=${FIREBASE_CONFIG_PATH:classpath:firebase-service-account.json}
firebase.database.url=${FIREBASE_DB_URL:}





# =====================================================
# UPLOAD LIMITS & STORAGE
# =====================================================
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
app.storage.security.max-file-size=524288000
app.storage.user-quota-gb=10
app.storage.admin-quota-gb=50

# =====================================================
# SECURITY CONFIGURATION
# =====================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=1800000
jwt.refresh-expiration=604800000
session.timeout=30
session.max-concurrent=5
login.max-attempts=5
login.lockout-duration=15
security.password.strength=10

# Encryption Key (Required! Set env ENCRYPTION_KEY or EncryptionService.generateKey())
app.encryption.key=${ENCRYPTION_KEY}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

# Google OAuth (audience verification)
app.security.google.client-id=${GOOGLE_CLIENT_ID:}

# Google Drive OAuth (for Storage Integration)
app.storage.google.client-id=${GOOGLE_DRIVE_CLIENT_ID:}
app.storage.google.client-secret=${GOOGLE_DRIVE_CLIENT_SECRET:}
app.storage.google.redirect-uri=${GOOGLE_DRIVE_REDIRECT_URI:http://localhost:8080/api/storage/oauth2/callback}
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Security Headers
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true