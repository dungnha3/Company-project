# Render Blueprint - Auto-deploy Backend
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: be-backend
    env: docker
    region: singapore
    plan: free
    dockerfilePath: ./BE/Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: RENDER
        value: true
      - key: DDL_AUTO
        value: validate
