name: CI/CD Pipeline

on:
  push:
    branches: [main, Dung, master]
  pull_request:
    branches: [main, Dung, master]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  # =====================================================
  # Job 1: Backend - Build & Test
  # =====================================================
  backend-build:
    name: Backend Build (Java ${{ env.JAVA_VERSION }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('BE/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build Backend
        run: cd BE && mvn package -DskipTests -B -q

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-war
          path: BE/target/BE-0.0.1-SNAPSHOT.war
          retention-days: 5

  # =====================================================
  # Job 2: Frontend - Build
  # =====================================================
  frontend-build:
    name: Frontend Build (Node ${{ env.NODE_VERSION }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web-v2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend-web-v2/package-lock.json

      - name: Install dependencies
        run: cd frontend-web-v2 && npm ci

      - name: Build Frontend
        run: cd frontend-web-v2 && npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-web-v2/dist
          retention-days: 5

  # =====================================================
  # Job 3: Deploy to Render (Backend only)
  # =====================================================
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: backend-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Dung' || github.ref == 'refs/heads/master')
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-war
          path: BE/target/

      - name: Deploy to Render
        uses: render/deploy-to-render@v1
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID_BE }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          build-command: cd BE && mvn package -DskipTests -B
          start-command: java -jar BE/target/BE-0.0.1-SNAPSHOT.war
          health-check-path: /actuator/health
          envVars: |
            RENDER=true
            DDL_AUTO=validate

  # =====================================================
  # Job 4: Deploy to Vercel (Frontend only)
  # =====================================================
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: frontend-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Dung' || github.ref == 'refs/heads/master')
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-web-v2/dist

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend-web-v2
