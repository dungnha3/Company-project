name: CI/CD Pipeline

on:
  push:
    branches: [main, Dung, master]
  pull_request:
    branches: [main, Dung, master]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  # =====================================================
  # Job 1: Backend - Build & Push Docker Image to GHCR
  # =====================================================
  backend-build-and-push:
    name: Backend Build & Push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./BE
          file: ./BE/Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Dung' || github.ref == 'refs/heads/master') }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/be-backend:latest
            ghcr.io/${{ env.OWNER_LC }}/be-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Deploy Webhook
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Dung' || github.ref == 'refs/heads/master') && secrets.RENDER_DEPLOY_HOOK != ''
        run: |
          echo "Triggering Render Deploy Hook..."
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  # =====================================================
  # Job 2: Frontend - Build
  # =====================================================
  frontend-build:
    name: Frontend Build (Node ${{ env.NODE_VERSION }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frontend-web-v2
          sparse-checkout-cone-mode: false

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend-web-v2/package-lock.json

      - name: Install dependencies
        run: cd frontend-web-v2 && npm ci

      - name: Build Frontend
        run: |
          cd frontend-web-v2
          npm run build
          cp vercel.json dist/vercel.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-web-v2/dist
          retention-days: 1

  # =====================================================
  # Job 4: Deploy Frontend to Vercel
  # =====================================================
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: frontend-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Dung' || github.ref == 'refs/heads/master')
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          vercel --prod --token=$VERCEL_TOKEN --yes --dir=dist
