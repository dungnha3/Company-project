# =====================================================
# APPLICATION CONFIGURATION
# Enterprise Management System - Backend
# =====================================================
# Application Info
spring.application.name=BE
server.port=8080
# HTTP Character Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
# Docker Compose
spring.docker.compose.enabled=false
# =====================================================
# DATABASE CONFIGURATION (SQL Server)
# =====================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DACN;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.username=nhombay
spring.datasource.password=Admin@123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC+7
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=false
spring.jpa.properties.hibernate.query.startup_check=false
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Connection Pool (HikariCP) - OPTIMIZED
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
# =====================================================
# SECURITY CONFIGURATION
# =====================================================
jwt.secret=${JWT_SECRET:change-this-secret-in-production}
jwt.expiration=1800000
jwt.refresh-expiration=604800000
session.timeout=30
session.max-concurrent=5
login.max-attempts=5
login.lockout-duration=15
security.password.strength=10
# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
# Security Headers
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
# =====================================================
# FILE UPLOAD CONFIGURATION
# =====================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB
file.upload-dir=./uploads
file.max-size-mb=10
# =====================================================
# LOGGING CONFIGURATION
# =====================================================
logging.level.root=INFO
logging.level.DoAn.BE=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.charset.console=UTF-8
logging.charset.file=UTF-8
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# =====================================================
# JACKSON CONFIGURATION (JSON)
# =====================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.default-property-inclusion=non_null
# =====================================================
# VALIDATION CONFIGURATION
# =====================================================
spring.validation.enabled=true
# =====================================================
# ACTUATOR CONFIGURATION (Monitoring)
# =====================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true
# =====================================================
# WEBSOCKET CONFIGURATION (Chat)
# =====================================================
websocket.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173
# =====================================================
# REDIS CACHING CONFIGURATION
# =====================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=simple
# =====================================================
# PERFORMANCE OPTIMIZATION
# =====================================================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,text/javascript,application/javascript
server.compression.min-response-size=1024
server.http2.enabled=true
# =====================================================
# INTERNATIONALIZATION (i18n)
# =====================================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# =====================================================
# ERROR HANDLING
# =====================================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false
# =====================================================
# DEVELOPMENT HELPERS
# =====================================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
# =====================================================
# CUSTOM APPLICATION PROPERTIES
# =====================================================
app.name=Enterprise Management System
app.version=1.0.0
app.description=Integrated HR, Project Management, and Chat System
app.pagination.default-page-size=20
app.pagination.max-page-size=100
app.hr.max-leave-days-per-year=12
app.project.max-members-per-project=50
app.storage.user-quota-gb=5
app.storage.admin-quota-gb=10
# GPS Attendance Configuration
company.latitude=10.855059
company.longitude=106.779390
company.radius=50000
# =====================================================
# AI CHATBOT CONFIGURATION (Google Gemini)
# =====================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-2.5-flash
gemini.api.max-tokens=2000
gemini.api.temperature=0.7
gemini.api.timeout=60
gemini.api.max-conversation-history=10
ai.assistant.max-context-length=4000
ai.assistant.default-language=vi